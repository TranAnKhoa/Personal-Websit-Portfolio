{% extends "app/base.html" %}
{%load static%}


<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
    </head>
    <body>
        {% block register %}
        <h5> Result search for {{searched}}</h5> <br/>
        <div class='row' style="width:100%">
            {%for product in keys %}
            <!--Video1-->
            <div class="col-lg-3">
                <video class="thumbnail" style="width: 460px; height: auto; margin-bottom: 15px; border-radius: 5px;" 
                    controls poster="{{product.PosterURL}}">
                    <source src="{{product.VideoURL}}" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
                <!--Khung sản phẩm-->
                <div class="box-eleme nt product">
                    <h6><strong>{{product.name}}</strong></h6>
                    <hr>
        
                    <button data-product={{product.id}} data-action ='add' class="btn btn-outline-secondary add-btn update-cart">Add to cart</button>
                    <a class="btn btn-outline-success" href="#">Purchase</a>
                    <h4 style="display: inline-block; float: right"><strong>{{product.price|floatformat}} VND </strong></h4>
                </div>
            </div>
            {% endfor %}
        </div>
        {% endblock register %}
    </body>
</html>
